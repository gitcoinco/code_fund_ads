# CAMPAIGN_DEMO_ID: "395"
# PG_HOST: localhost
# PG_USERNAME: ubuntu
# RAILS_ENV: test
# RACK_ENV: test
# DEFAULT_HOST: codefund.io
# PARALLEL_WORKERS: "1"
# REDIS_CACHE_URL: redis://127.0.0.1:6379
# REDIS_QUEUE_URL: redis://127.0.0.1:6379
# WORDPRESS_URL: 'https://codefund.io'
# - image: circleci/redis:5.0.4

version: 2

references:
  default_docker_ruby_executor: &default_docker_ruby_executor
    image: circleci/ruby:2.6.5-stretch-node
    environment:
      BUNDLE_JOBS: 3
      BUNDLE_RETRY: 3
      BUNDLE_PATH: vendor/bundle
      RAILS_ENV: test
  postgres: &postgres
    image: circleci/postgres:11.2
    environment:
      POSTGRES_USER: code_fund_ads
      POSTGRES_DB: code_fund_ads_test_test
      POSTGRES_PASSWORD: ""

jobs:
  build:
    docker:
      - *default_docker_ruby_executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - code_fund_ads-bundle-v2-{{ checksum "Gemfile.lock" }}
            - code_fund_ads-bundle-v2-
      - run:
          name: Bundle Install
          command: |
            gem install bundler
            bundle check || bundle install
      - save_cache:
          key: code_fund_ads-bundle-v2-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - restore_cache:
          keys:
            - code_fund_ads-yarn-{{ checksum "yarn.lock" }}
            - code_fund_ads-yarn-
      - run:
          name: Yarn Install
          command: yarn install --cache-folder ~/.cache/yarn --ignore-engines --frozen-lockfile
      - save_cache:
          key: code_fund_ads-yarn-{{ checksum "yarn.lock" }}
          paths:
            - ~/.cache/yarn
  test:
    parallelism: 3
    docker:
      - *default_docker_ruby_executor
      - *postgres
    steps:
      - checkout
      - restore_cache:
          keys:
            - code_fund_ads-bundle-v2-{{ checksum "Gemfile.lock" }}
            - code_fund_ads-bundle-v2-
      - run:
          name: Bundle Install
          command: |
            gem install bundler
            bundle check || bundle install
      - restore_cache:
          keys:
            - code_fund_ads-yarn-{{ checksum "yarn.lock" }}
            - code_fund_ads-yarn-
      - run:
          name: Wait for DB
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Database setup
          command: bundle exec rails db:schema:load --trace
      - run:
          command: |
            TESTFILES=$(circleci tests glob "test/**/*_test.rb" | circleci tests split --split-by=timings)
            bundle exec rails test $TESTFILES
      - store_artifacts:
          path: tmp/screenshots
          destination: screenshots
workflows:
  version: 2
  build_and_test:
    jobs:
      - build
      - test:
          requires:
            - build
