version: 2

anchors:
  - &install_pg_dependencies
    name: Install pg dependencies
    command: |
      sudo apt-get update
      sudo apt-get install -y postgresql-client

  - &install_bundler
    name: Install bundler
    command: gem install bundler:2.0.1

  - &install_yarn
    name: Install yarn
    command: curl -o- -L https://yarnpkg.com/install.sh | bash

  - &wait_for_db
    name: Wait for DB
    command: dockerize -wait tcp://localhost:5432 -timeout 1m

  - &db_setup
    name: Database setup
    command: bundle exec rails db:schema:load --trace

  - &restore_bundler_cache
    keys:
      - codefund-bundler-cache-{{ checksum "Gemfile.lock" }}
      - codefund-bundler-cache-

  - &bundle
    name: Bundle Install
    command: bundle check --path=vendor/bundle || bundle install --deployment --jobs 4 --retry 3

  - &save_bundler_cache
    key: codefund-bundler-cache-{{ checksum "Gemfile.lock" }}
    paths:
      - vendor/bundle

  - &restore_yarn_cache
    keys:
      - codefund-yarn-cache-{{ checksum "yarn.lock" }}
      - codefund-yarn-cache-

  - &yarn
    name: Yarn Install
    command: yarn install --ignore-engines --frozen-lockfile --cache-folder ~/.cache/yarn

  - &save_yarn_cache
    key: codefund-yarn-{{ checksum "yarn.lock" }}
    paths:
      - ~/.cache/yarn

  - &restore_webpacker_cache
    keys:
      - codefund-webpacker-cache-{{ arch }}-{{ .Branch }}
      - codefund-webpacker-cache-

  - &precompile
    name: Precompile Webpacker Assets
    command: RAILS_ENV=test bundle exec rails webpacker:compile

  - &save_webpacker_cache
    key: codefund-webpacker-cache-{{ arch }}-{{ .Branch }}-{{ epoch }}
    paths:
      - public/packs-test

references:
  default_docker_ruby_executor: &default_docker_ruby_executor
    image: circleci/ruby:2.6.5-node-browsers
    environment:
      BUNDLE_JOBS: 3
      BUNDLE_RETRY: 3
      BUNDLE_PATH: vendor/bundle
      PG_HOST: localhost
      PG_USER: ubuntu
      RAILS_ENV: test
      RACK_ENV: test
      AWS_S3_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_S3_BUCKET: example_s3_bucket
      AWS_S3_REGION: us-west-2
      AWS_S3_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYzEXAMPLEKEY
      BASE_ECPM: 400
      BUFFER_ENABLED: false
      DEFAULT_HOST: codefund.io
      ENABLED_FEATURES: jobs
      HUBSPOT_ENABLED: false
      PARALLEL_WORKERS: 1
      PG_TIMEOUT_IN_SECONDS: 3
      RAILS_MAX_THREADS: 10
      REDIS_CACHE_URL: redis://127.0.0.1:6379
      REDIS_QUEUE_URL: redis://127.0.0.1:6379
      SCOUT_SAMPLE_RATE: 0.3
      DATABASE_URL: "postgres://ubuntu@localhost:5432/code_fund_ads_test"
  postgres: &postgres
    image: circleci/postgres:11.2
    environment:
      POSTGRES_USER: ubuntu
      POSTGRES_DB: code_fund_ads_test
  redis: &redis
    image: circleci/redis:5.0.4

jobs:
  build:
    docker:
      - *default_docker_ruby_executor
    steps:
      - checkout
      - run: *install_pg_dependencies
      - run: *install_yarn
      - run: *install_bundler
      - restore_cache: *restore_bundler_cache
      - run: *bundle
      - save_cache: *save_bundler_cache
      - restore_cache: *restore_yarn_cache
      - run: *yarn
      - save_cache: *save_yarn_cache
      - restore_cache: *restore_webpacker_cache
      - run: *precompile
      - save_cache: *save_webpacker_cache
      - run: *wait_for_db
      - run: *db_setup


  test:
    parallelism: 3
    docker:
      - *default_docker_ruby_executor
      - *postgres
    steps:
      - checkout
      - restore_cache: *restore_bundler_cache
      - run: *bundle
      - restore_cache: *restore_yarn_cache
      - run: *wait_for_db
      - run: *db_setup
      - run:
          command: |
            TESTFILES=$(circleci tests glob "test/**/*_test.rb" | circleci tests split --split-by=timings)
            bin/rails test $TESTFILES

  zeitwerk:
    docker:
      - *default_docker_ruby_executor
      - *postgres
    steps:
      - checkout
      - restore_cache: *restore_bundler_cache
      - run: *bundle
      - restore_cache: *restore_yarn_cache
      - run: *wait_for_db
      - run: *db_setup
      - run:
          command: bundle exec rails zeitwerk:check

  standardrb:
    docker:
      - *default_docker_ruby_executor
      - *postgres
      - *redis
    steps:
      - checkout
      - restore_cache: *restore_bundler_cache
      - run: *bundle
      - restore_cache: *restore_yarn_cache
      - run: *wait_for_db
      - run: *db_setup
      - run:
          command: bundle exec standardrb --format progress

  erb_lint:
    docker:
      - *default_docker_ruby_executor
      - *postgres
      - *redis
    steps:
      - checkout
      - restore_cache: *restore_bundler_cache
      - run: *bundle
      - restore_cache: *restore_yarn_cache
      - run: *wait_for_db
      - run: *db_setup
      - run:
          command: bundle exec erblint app/views_redesigned/**/*.html.erb

  prettier_standard:
    docker:
      - *default_docker_ruby_executor
      - *postgres
      - *redis
    steps:
      - checkout
      - restore_cache: *restore_yarn_cache
      - run: *yarn
      - run: *wait_for_db
      - run: *db_setup
      - run:
          command: yarn run --ignore-engines prettier-standard --check 'app/**/*.js'

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
      - test:
          requires:
            - build
      - zeitwerk:
          requires:
            - build
      - standardrb:
          requires:
            - build
      - erb_lint:
          requires:
            - build
      - prettier_standard:
          requires:
            - build
