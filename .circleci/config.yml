version: 2

references:
  default_docker_ruby_executor: &default_docker_ruby_executor
    image: circleci/ruby:2.6.5-node-browsers
    environment:
      BUNDLE_JOBS: 3
      BUNDLE_RETRY: 3
      BUNDLE_PATH: vendor/bundle
      PG_HOST: localhost
      PG_USER: ubuntu
      RAILS_ENV: test
      RACK_ENV: test
      AWS_S3_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_S3_BUCKET: example_s3_bucket
      AWS_S3_REGION: us-west-2
      AWS_S3_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYzEXAMPLEKEY
      BASE_ECPM: 400
      BUFFER_ENABLED: false
      DEFAULT_HOST: codefund.io
      ENABLED_FEATURES: jobs
      HUBSPOT_ENABLED: false
      PARALLEL_WORKERS: 1
      PG_TIMEOUT_IN_SECONDS: 3
      RAILS_MAX_THREADS: 10
      REDIS_CACHE_URL: redis://127.0.0.1:6379
      REDIS_QUEUE_URL: redis://127.0.0.1:6379
      SCOUT_SAMPLE_RATE: 0.3
      DATABASE_URL: "postgres://ubuntu@localhost:5432/code_fund_ads_test"
  postgres: &postgres
    image: circleci/postgres:11.2
    environment:
      POSTGRES_USER: ubuntu
      POSTGRES_DB: code_fund_ads_test
  redis: &redis
    image: circleci/redis:5.0.4

jobs:
  build:
    docker:
      - *default_docker_ruby_executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - codefund-bundle-v1-{{ checksum "Gemfile.lock" }}
            - codefund-bundle-v1-
      - run:
          name: Bundle Install
          command: bundle check || bundle install
      - save_cache:
          key: codefund-bundle-v1-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - restore_cache:
          keys:
            - codefund-yarn-{{ checksum "yarn.lock" }}
            - codefund-yarn-
      - run:
          name: Yarn Install
          command: yarn install --cache-folder ~/.cache/yarn
      - save_cache:
          key: codefund-yarn-{{ checksum "yarn.lock" }}
          paths:
            - ~/.cache/yarn

  test:
    parallelism: 3
    docker:
      - *default_docker_ruby_executor
      - *postgres
      - *redis
    steps:
      - checkout
      - restore_cache:
          keys:
            - codefund-bundle-v1-{{ checksum "Gemfile.lock" }}
            - codefund-bundle-v1-
      - run:
          name: Bundle Install
          command: bundle check || bundle install
      - restore_cache:
          keys:
            - codefund-yarn-{{ checksum "yarn.lock" }}
            - codefund-yarn-
      - run:
          name: Wait for DB
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Database setup
          command: bundle exec rails db:schema:load --trace
      - run:
          command: |
            TESTFILES=$(circleci tests glob "test/**/*_test.rb" | circleci tests split --split-by=timings)
            bin/rails test $TESTFILES

  zeitwerk:
    docker:
      - *default_docker_ruby_executor
      - *postgres
      - *redis
    steps:
      - checkout
      - restore_cache:
          keys:
            - codefund-bundle-v1-{{ checksum "Gemfile.lock" }}
            - codefund-bundle-v1-
      - run:
          name: Bundle Install
          command: bundle check || bundle install
      - restore_cache:
          keys:
            - codefund-yarn-{{ checksum "yarn.lock" }}
            - codefund-yarn-
      - run:
          command: bundle exec rails zeitwerk:check

  standardrb:
    docker:
      - *default_docker_ruby_executor
      - *postgres
      - *redis
    steps:
      - checkout
      - restore_cache:
          keys:
            - codefund-bundle-v1-{{ checksum "Gemfile.lock" }}
            - codefund-bundle-v1-
      - run:
          name: Bundle Install
          command: bundle check || bundle install
      - restore_cache:
          keys:
            - codefund-yarn-{{ checksum "yarn.lock" }}
            - codefund-yarn-
      - run:
          command: bundle exec standardrb --format progress

  erb_lint:
    docker:
      - *default_docker_ruby_executor
      - *postgres
      - *redis
    steps:
      - checkout
      - restore_cache:
          keys:
            - codefund-bundle-v1-{{ checksum "Gemfile.lock" }}
            - codefund-bundle-v1-
      - run:
          name: Bundle Install
          command: bundle check || bundle install
      - restore_cache:
          keys:
            - codefund-yarn-{{ checksum "yarn.lock" }}
            - codefund-yarn-
      - run:
          command: bundle exec erblint app/views_redesigned/**/*.html.erb

  prettier_standard:
    docker:
      - *default_docker_ruby_executor
      - *postgres
      - *redis
    steps:
      - checkout
      - restore_cache:
          keys:
            - codefund-bundle-v1-{{ checksum "Gemfile.lock" }}
            - codefund-bundle-v1-
      - run:
          name: Bundle Install
          command: bundle check || bundle install
      - restore_cache:
          keys:
            - codefund-yarn-{{ checksum "yarn.lock" }}
            - codefund-yarn-
      - run:
          command: yarn run --ignore-engines prettier-standard --check 'app/**/*.js'

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
      - test:
          requires:
            - build
      - zeitwerk:
          requires:
            - build
      - standardrb:
          requires:
            - build
      - erb_lint:
          requires:
            - build
      - prettier_standard:
          requires:
            - build
