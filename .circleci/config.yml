# Ruby CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-ruby/ for more details
#
version: 2
jobs:
  build:
    docker:
      # specify the version you desire here
      - image: circleci/ruby:2.6.1-node-browsers

      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      - image: circleci/postgres:11.2
      - image: circleci/redis:5.0.4

    working_directory: ~/repo

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "Gemfile.lock" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run:
          name: install dependencies
          command: |
            bundle install --jobs=4 --retry=3 --path vendor/bundle

      - save_cache:
          paths:
            - ./vendor/bundle
          key: v1-dependencies-{{ checksum "Gemfile.lock" }}

      # Database setup
      - run: bundle exec rails db:create
      - run: bundle exec rails db:schema:load

      # Environment variables
      - run:
          name: Setup Environment Variables
          command: |
            echo 'export AWS_S3_ACCESS_KEY_ID="AKIAIOSFODNN7EXAMPLE"' >> $BASH_ENV
            echo 'export AWS_S3_BUCKET="example_s3_bucket"' >> $BASH_ENV
            echo 'export AWS_S3_REGION="us-west-2"' >> $BASH_ENV
            echo 'AWS_S3_SECRET_ACCESS_KEY="wJalrXUtnFEMI/K7MDENG/bPxRfiCYzEXAMPLEKEY"' >> $BASH_ENV
            echo 'export BASE_ECPM="400"' >> $BASH_ENV
            echo 'export BUFFER_ENABLED="false"' >> $BASH_ENV
            echo 'export DEFAULT_HOST="codefund.app"' >> $BASH_ENV
            echo 'export ENABLED_FEATURES="jobs"' >> $BASH_ENV
            echo 'export HUBSPOT_ENABLED="false"' >> $BASH_ENV
            echo 'export PG_TIMEOUT_IN_SECONDS="3"' >> $BASH_ENV
            echo 'export RAILS_MAX_THREADS="10"' >> $BASH_ENV
            echo 'export REDIS_CACHE_URL="redis://127.0.0.1:6379"' >> $BASH_ENV
            echo 'export REDIS_QUEUE_URL="redis://127.0.0.1:6379"' >> $BASH_ENV
            echo 'export SCOUT_SAMPLE_RATE="0.3"' >> $BASH_ENV

      # run tests!
      - run:
          name: run tests
          command: bundle exec rails test
